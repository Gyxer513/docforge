# Fly.io конфигурация — сборка идёт через Dockerfile, поэтому версия
# Python фиксируется базовым образом (python:3.11-slim), а не этим файлом.
app = "docforge"
primary_region = "fra"

[build]

[env]
  DOCFORGE_ENVIRONMENT = "production"
  DOCFORGE_LOG_LEVEL = "INFO"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"
